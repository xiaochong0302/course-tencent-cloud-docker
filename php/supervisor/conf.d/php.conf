[program:php]
command=/usr/local/sbin/php-fpm
process_name=%(program_name)s
numprocs=1
autostart=true
autorestart=true
redirect_stderr=true
startretries=30
startsecs=10
stopsignal=TERM
stopwaitsecs=60
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stderr_logfile=/var/log/supervisor/%(program_name)s_error.log
